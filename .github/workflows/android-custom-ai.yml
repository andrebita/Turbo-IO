name: Android custom AI
on:
  pull_request:
    paths:
      - 'android-custom-ai/**'
      - 'harmony-sdk/turbo_core/**'
      - '.github/workflows/android-custom-ai.yml'
  push:
    branches: [main]
    paths:
      - 'android-custom-ai/**'
      - '.github/workflows/android-custom-ai.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-custom-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: sha256sum app/build/outputs/apk/debug/app-debug.apk
